---
# This is the ONE manifest in this repo that is not synced by ArgoCD itself.
# ArgoCD can't sync the Application object that creates it (chicken/egg), so
# apply it manually, once, after the OpenShift GitOps Operator is installed:
#
#   oc apply -f bootstrap/root-application.yml
#
# From then on, ArgoCD watches clusters/prod-cluster-01 and manages everything
# else in this repo (including itself, via configuration/operators/openshift-gitops).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-cluster-01
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bry-tam/ocp-config-static.git
    targetRevision: main
    path: clusters/prod-cluster-01
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # This repo installs operators (via Subscription) and their CRs (e.g.
      # HyperConverged, NMState, KubeDescheduler) in the same Application.
      # Argo CD's default dry-run preflight validates every resource before
      # applying anything, which fails for CRs whose CRD hasn't been
      # installed by its operator yet. Skipping dry-run for resource kinds
      # not yet present lets Namespaces/OperatorGroups/Subscriptions apply
      # first; selfHeal then retries the CRD-dependent CRs once their
      # operators have installed the CRDs.
      - SkipDryRunOnMissingResource=true
