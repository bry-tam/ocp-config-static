---
# `argo-admin-controller` is labeled `rbac.authorization.k8s.io/
# aggregate-to-admin: "true"`, which Kubernetes' built-in aggregation
# mechanism automatically merges into the cluster's default `admin`
# ClusterRole -- granting namespace/OperatorGroup/ClusterRole(Binding)
# management permissions to anyone bound to `admin`
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argo-admin-controller
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - "*"
  - apiGroups:
      - operators.coreos.com
    resources:
      - operatorgroups
    verbs:
      - "*"
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - "*"

---
# Second aggregation layer: rolls up anything labeled
# `rbac.authorization.k8s.io/aggregate-to-admin: "true"` (including the
# ClusterRole above) into a role named after this ArgoCD instance, so it can
# be bound directly instead of relying solely on the cluster's built-in
# `admin` ClusterRole picking up the aggregation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.argocd.name }}-controller-admin
  labels:
    argocd/aggregate-to-admin: "true"
    app.kubernetes.io/managed-by: {{ .Values.argocd.name }}
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-admin: "true"

---
# The two ClusterRoles above only cover namespaces/OperatorGroups/ClusterRoles.
# This repo's Application also manages Subscriptions, operator CRs (e.g.
# HyperConverged, NMState, KubeDescheduler), MachineConfigs, and other
# cluster-scoped resources (Console, Group, ConsoleLink) whose API groups
# vary per component and grow as components are added under
# configuration/operators/. Rather than maintain an ever-expanding rule list
# here, grant the ArgoCD application-controller service account cluster-admin
# directly -- this is a hub/management-cluster pattern, not something to
# replicate on a workload cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.argocd.name }}-application-controller-cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.argocd.name }}-argocd-application-controller
    namespace: {{ .Values.argocd.namespace }}
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
