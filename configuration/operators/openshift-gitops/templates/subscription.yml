---
# The OLM Subscription for the OpenShift GitOps Operator itself. Note the
# bootstrap chicken/egg: the operator (and thus ArgoCD) must already be
# installed once, out-of-band (OperatorHub console or `oc apply`), before
# this repo's root Application (bootstrap/root-application.yaml) can be
# applied at all. Once bootstrapped, ArgoCD adopts/reconciles this same
# Subscription going forward, so channel/approval changes made here (e.g.
# bumping `subscription.channel` in values.yaml) take effect through the
# normal GitOps flow from then on.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: {{ .Values.subscription.name }}
  namespace: {{ .Values.subscription.namespace }}
spec:
  channel: {{ .Values.subscription.channel }}
  name: {{ .Values.subscription.name }}
  source: {{ .Values.subscription.source }}
  sourceNamespace: {{ .Values.subscription.sourceNamespace }}
  installPlanApproval: {{ .Values.subscription.installPlanApproval }}
