---
{{- if eq .Values.remediation.strategy "snr" }}
apiVersion: self-node-remediation.medik8s.io/v1alpha1
kind: SelfNodeRemediationTemplate
metadata:
  annotations:
    remediation.medik8s.io/multiple-templates-support: "true"
  name: snr-outofservicetaint-template
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      remediationStrategy: OutOfServiceTaint
{{- else if eq .Values.remediation.strategy "far" }}
apiVersion: fence-agents-remediation.medik8s.io/v1alpha1
kind: FenceAgentsRemediationTemplate
metadata:
  name: far-outofservicetaint-template
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      remediationStrategy: OutOfServiceTaint
      # This template needs an agent configured, which is going to be
      # environment specific. See:
      # https://docs.redhat.com/en/documentation/workload_availability_for_red_hat_openshift/latest/html/remediation_fencing_and_maintenance/fence-agents-remediation-operator-remediate-nodes#supported-agents-fence-agents-remediation-operator_fence-agents-remediation-operator-remediate-nodes
{{- end }}
---
apiVersion: machine-deletion-remediation.medik8s.io/v1alpha1
kind: MachineDeletionRemediationTemplate
metadata:
  name: mdr-remediation
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec: {}
