---
# Customizes the ArgoCD instance that the OpenShift GitOps Operator creates by
# default in the openshift-gitops namespace. The Operator itself is assumed to
# already be installed (via OperatorHub/Subscription) before this is applied.
apiVersion: argoproj.io/v1alpha1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  server:
    route:
      enabled: true
  rbac:
    defaultPolicy: role:readonly
    policy: |
      g, cluster-admins, role:admin
    scopes: '[groups]'
