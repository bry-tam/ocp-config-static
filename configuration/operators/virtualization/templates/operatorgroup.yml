---
# Namespace-scoped install -- OpenShift Virtualization is not an
# AllNamespaces operator. targetNamespaces matches the install namespace.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: {{ .Values.subscription.namespace }}
  namespace: {{ .Values.subscription.namespace }}
spec:
  targetNamespaces:
    - {{ .Values.subscription.namespace }}
