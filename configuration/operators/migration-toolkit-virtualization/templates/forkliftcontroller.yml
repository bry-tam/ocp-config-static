---
apiVersion: forklift.konveyor.io/v1beta1
kind: ForkliftController
metadata:
  name: {{ .Values.forkliftController.name }}
  namespace: {{ .Values.subscription.namespace }}
spec:
  olm_managed: {{ .Values.forkliftController.olmManaged }}
  # The ForkliftController CRD types this field as a string enum ("true"/
  # "false"), not a real boolean -- quote is required or the API server
  # rejects the CR with "must be of type string: boolean".
  feature_copy_offload: {{ .Values.forkliftController.featureCopyOffload | quote }}
